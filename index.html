<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <script>
    // Apply the saved theme before first paint so dark mode doesn't flash light.
    // Mirrors resolveTheme() in js/theme.js — that module is the spec; keep in sync.
    (function () {
      var t = null;
      try { t = localStorage.getItem('plaenicke.theme'); } catch (e) {}
      var dark = t === 'dark' || ((t === null || t === 'auto') &&
        window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.dataset.theme = 'dark';
    })();
  </script>
  <title>plaenicke</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <!-- The tab's title (home-screen spec § 2.2), set by js/app.js's
         showView. On Today it is visually hidden, never removed: Today's own
         heading names the day on screen, and this h1 still names the page
         for assistive tech (final review B3). -->
    <h1 id="tab-title" class="tab-title visually-hidden">Today</h1>
    <!-- When the screen was last brought up to date (Phase 0). iOS resumes
         this app rather than reloading it, so "is this current?" is a real
         question; js/app.js repaints this on load and on every resume. -->
    <span id="updated-stamp" class="stamp"></span>
    <!-- Settings, top right on every page (spec § 2.2, amended 2026-10-22):
         the header's last item. -->
    <button id="settings-btn" class="icon-btn" type="button" aria-label="Settings">&#9881;</button>
  </header>

  <!-- The app-shell sync indicator (V6 spec § 9 step 0). A broken sync is
       otherwise completely silent: the only status line in the app lives
       inside the settings panel, so a revoked token, a corrupt stored code or
       a stuck adoption all present as an app that works perfectly and quietly
       stops agreeing with the other device.

       This id is NOT the settings panel's 'sync-status'. Two elements cannot
       share an id — getElementById would return one of them and the other
       would silently never update again. js/linkui.js paints both, each by
       its own id. Starts hidden; renderSyncStatus() reveals it only when
       there is a problem. -->
  <p id="sync-indicator" class="sync-indicator" role="status" hidden></p>

  <section class="add-box">
    <div class="text-row">
      <input id="entry-text" type="text" autocomplete="off"
             placeholder="e.g. physics assignment due July second" />
      <button id="mic-btn" type="button" hidden aria-label="Dictate">&#127908;</button>
    </div>
    <div class="add-row">
      <input id="entry-date" type="date" />
      <input id="entry-time" type="time" />
      <input id="entry-end" type="time" hidden />
      <button id="add-btn" type="button">Add</button>
    </div>
    <p class="hint">Pick a date (and optional time) to add manually — smart add handles plain sentences.</p>
    <p id="message" class="message" role="status"></p>
  </section>

  <section id="preview" hidden></section>

  <!-- Calendar's switcher (spec § 4), shown on the Calendar tab only. List
       was removed in stage 3d (Alex, 2026-10-22); 3-day joins after Day
       once it is built (question 5). -->
  <div id="cal-switch" class="cal-switch" role="group" aria-label="Calendar view" hidden>
    <button id="show-day" type="button" aria-pressed="false">Day</button>
    <button id="show-week" type="button" aria-pressed="false">Week</button>
    <button id="show-month" type="button" aria-pressed="false">Month</button>
  </div>

  <!-- Today (home-screen spec § 2): js/today.js decides what is on it and
       js/todayview.js draws it into #today-body. The Settings gear is in
       the shell header, not here (spec § 2.2, amended 2026-10-22). -->
  <section id="today-view">
    <div class="today-head">
      <div>
        <h2 class="today-title">Today</h2>
        <p id="today-date" class="today-date"></p>
      </div>
    </div>
    <div id="today-body"></div>
  </section>

  <section id="calendar-view" hidden>
    <div class="cal-controls">
      <button id="prev-month" type="button">&larr;</button>
      <span id="calendar-label"></span>
      <button id="next-month" type="button">&rarr;</button>
    </div>
    <div id="calendar-grid" class="calendar-grid"></div>
  </section>

  <section id="week-view" hidden>
    <div class="cal-controls">
      <button id="prev-week" type="button">&larr;</button>
      <span id="week-label"></span>
      <button id="next-week" type="button">&rarr;</button>
    </div>
    <div id="week-grid" class="week-grid"></div>
    <section id="week-list" class="today-section wlist"></section>
  </section>

  <section id="day-view" hidden>
    <div class="cal-controls">
      <button id="prev-day" type="button">&larr;</button>
      <span id="day-label"></span>
      <button id="next-day" type="button">&rarr;</button>
    </div>
    <div id="day-body"></div>
  </section>

  <!-- To-do (V6 § 5). No add box: to-dos are captured by voice through the
       main entry box and classified by the model. -->
  <section id="todo-view" hidden>
    <ul id="todo-list"></ul>
  </section>

  <!-- Ideas (V6 § 6). This box is the offline, deterministic capture path —
       it works with no Worker at all. -->
  <section id="ideas-view" hidden>
    <div class="idea-add">
      <textarea id="idea-text" rows="3" placeholder="A thought to keep — no date needed"></textarea>
      <button id="idea-add" type="button">Keep</button>
    </div>
    <ul id="idea-list"></ul>
  </section>

  <!-- The tab bar (spec § 4), fixed at the bottom. -->
  <nav class="tab-bar" aria-label="Pages">
    <button id="tab-today" type="button" class="active" aria-current="page">Today</button>
    <button id="tab-calendar" type="button">Calendar</button>
    <button id="tab-todo" type="button">To-do</button>
    <button id="tab-ideas" type="button">Ideas</button>
  </nav>

  <div id="settings-host"></div>
  <!-- The item sheet (js/itemsheet.js) mounts here. -->
  <div id="sheet-host"></div>
  <!-- The capture box and its round button (home-screen spec § 3), driven by
       js/capture.js. They come AFTER both hosts above on purpose: styles.css
       hides the button with `#settings-host:not(:empty) ~ .capture-btn` and
       `#sheet-host:not(:empty) ~ .capture-btn`, and `~` only matches a LATER
       sibling. The box is not a modal: no backdrop, no tap-outside-to-close. -->
  <div id="capture-box" class="capture-box" hidden>
    <div class="capture-panel" role="region" aria-label="Capture">
      <textarea id="capture-text" class="capture-text" rows="2" autocomplete="off"
                placeholder="Say it, or tap here to type"></textarea>
      <p id="capture-message" class="message" role="status"></p>
      <button id="capture-type" class="capture-type" type="button" hidden>Type instead</button>
      <section id="capture-preview" class="capture-preview" hidden></section>
      <!-- One row, last and sticky at the panel's bottom, so Add stays
           reachable however much text or preview there is: x on the left,
           Cancel / Add on the right. -->
      <div class="capture-actions">
        <button id="capture-close" class="capture-close" type="button" aria-label="Close">&times;</button>
        <button id="capture-cancel" class="cancel" type="button" hidden>Cancel</button>
        <button id="capture-add" type="button">Add</button>
      </div>
    </div>
  </div>
  <button id="capture-btn" class="capture-btn" type="button"
          aria-label="Capture by voice" aria-expanded="false" aria-controls="capture-box">
    <svg class="icon-mic" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="9" y="3" width="6" height="11" rx="3"></rect>
      <path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path>
    </svg>
    <svg class="icon-stop" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"></rect>
    </svg>
  </button>
  <!-- The toast (js/toast.js). The host is NOT a live region: it holds the
       Undo button, which would be read out as part of every notice. The
       message is announced through #toast-live, which is PERSISTENT because a
       live region inserted already filled is often not announced. -->
  <div id="toast-host"></div>
  <p id="toast-live" class="visually-hidden" role="status" aria-live="polite"></p>

  <script type="module" src="js/app.js"></script>
</body>
</html>

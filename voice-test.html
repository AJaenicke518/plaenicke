<!doctype html>
<!-- THROWAWAY spike (2026-10-20): checks what iPhone Safari's speech
     recognition supports for the planned tap-to-start / tap-to-stop mic with
     live words. Not part of the app, not in service-worker ASSETS. Delete
     after the result is recorded. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>plaenicke voice test</title>
<style>
  body { font: 16px/1.4 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: #f6f0e4; color: #2b2118; }
  h1 { font: 600 22px Georgia, serif; margin: 0 0 6px; }
  p { margin: 0 0 12px; color: #6b5c4a; }
  button { font: inherit; font-size: 18px; width: 100%; min-height: 64px; border-radius: 16px; border: 0; background: #7a4a2a; color: #fff; }
  button.on { background: #a33b2b; }
  #live { min-height: 3em; margin: 14px 0; padding: 12px; background: #fffaf1; border: 1px solid #d8ccb6; border-radius: 12px; font-size: 18px; }
  #live .interim { color: #a3937e; }
  #log { font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; background: #fffaf1; border: 1px solid #d8ccb6; border-radius: 12px; padding: 10px; }
</style>
</head>
<body>
<h1>Voice test</h1>
<p>Try each button in order. For each: tap, say a sentence, pause ~5 s, say more, tap again to stop. Then screenshot (or read me the summary line under each).</p>
<div id="modes"></div>
<button id="go" style="display:none">Tap to start</button>
<div id="live"></div>
<div id="summary" style="font-weight:600;margin-bottom:8px"></div>
<div id="log"></div>
<script>
  const t0 = Date.now();
  const logEl = document.getElementById('log');
  const live = document.getElementById('live');
  const btn = document.getElementById('go');
  const sum = document.getElementById('summary');
  const seen = { start: false, interim: false, final: false, autoEnd: false, stopDelivered: null, error: null };
  let rec = null, listening = false, stopTappedAt = 0, finalText = '';
  function log(m) { logEl.textContent += `${((Date.now() - t0) / 1000).toFixed(1)}s  ${m}\n`; }
  function summary() {
    sum.textContent = `supported=${!!SR} start=${seen.start} interim=${seen.interim} final=${seen.final} ` +
      `endedOnItsOwn=${seen.autoEnd} textAfterStop=${seen.stopDelivered} error=${seen.error || 'none'} ` +
      `standalone=${!!navigator.standalone}`;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  log(`UA: ${navigator.userAgent}`);
  log(`SpeechRecognition: ${SR ? 'yes' : 'NO'}  standalone(home screen): ${!!navigator.standalone}`);
  const MODES = [
    { key: '1', label: '1 · like the app today (one phrase, final words only)', continuous: false, interim: false },
    { key: '2', label: '2 · live words, one phrase', continuous: false, interim: true },
    { key: '3', label: '3 · keep listening, final words only', continuous: true, interim: false },
    { key: '4', label: '4 · keep listening + live words (the design)', continuous: true, interim: true },
  ];
  const results = {};
  const modesEl = document.getElementById('modes');
  for (const m of MODES) {
    const b = document.createElement('button');
    b.textContent = m.label; b.style.marginBottom = '6px';
    const line = document.createElement('div'); line.style.cssText = 'font-size:13px;margin:0 0 12px;font-weight:600';
    line.textContent = `${m.key}: not tried`;
    modesEl.append(b, line);
    b.addEventListener('click', () => run(m, b, line));
  }
  function run(m, b, line) {
    if (!SR) { log('not supported here'); return; }
    if (listening) { stopTappedAt = Date.now(); log(`[${m.key}] stop tapped -> rec.stop()`); rec.stop(); return; }
    const r = { start: false, interim: false, final: false, endedOnItsOwn: false, textAfterStop: null, error: 'none' };
    const show = () => { line.textContent = `${m.key}: start=${r.start} interim=${r.interim} final=${r.final} endedOnItsOwn=${r.endedOnItsOwn} textAfterStop=${r.textAfterStop} error=${r.error}`; };
    finalText = ''; live.textContent = ''; stopTappedAt = 0;
    rec = new SR();
    rec.lang = 'en-US'; rec.continuous = m.continuous; rec.interimResults = m.interim; rec.maxAlternatives = 1;
    rec.onstart = () => { r.start = true; listening = true; b.classList.add('on'); log(`[${m.key}] onstart`); show(); };
    rec.onspeechstart = () => log(`[${m.key}] onspeechstart`);
    rec.onspeechend = () => log(`[${m.key}] onspeechend`);
    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const x = e.results[i];
        if (x.isFinal) { finalText += x[0].transcript; r.final = true; if (stopTappedAt) r.textAfterStop = true; log(`[${m.key}] FINAL "${x[0].transcript}"`); }
        else { interim += x[0].transcript; r.interim = true; }
      }
      live.innerHTML = ''; live.append(document.createTextNode(finalText));
      const s = document.createElement('span'); s.className = 'interim'; s.textContent = interim; live.append(s);
      show();
    };
    rec.onerror = (e) => { r.error = e.error || 'unknown'; log(`[${m.key}] onerror: ${e.error}`); show(); };
    rec.onend = () => {
      listening = false; b.classList.remove('on');
      if (!stopTappedAt) r.endedOnItsOwn = true;
      if (stopTappedAt && r.textAfterStop === null) r.textAfterStop = false;
      log(`[${m.key}] onend (${stopTappedAt ? 'after stop tap' : 'on its own'})`);
      stopTappedAt = 0; show();
    };
    try { rec.start(); log(`[${m.key}] start() continuous=${m.continuous} interim=${m.interim}`); }
    catch (err) { r.error = err.name; log(`[${m.key}] start threw ${err.name}`); show(); }
  }
</script>
</body>
</html>

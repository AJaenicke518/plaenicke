<!doctype html>
<!-- THROWAWAY spike (2026-10-20): checks what iPhone Safari's speech
     recognition supports for the planned tap-to-start / tap-to-stop mic with
     live words. Not part of the app, not in service-worker ASSETS. Delete
     after the result is recorded. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>plaenicke voice test</title>
<style>
  body { font: 16px/1.4 -apple-system, system-ui, sans-serif; margin: 0; padding: 16px; background: #f6f0e4; color: #2b2118; }
  h1 { font: 600 22px Georgia, serif; margin: 0 0 6px; }
  p { margin: 0 0 12px; color: #6b5c4a; }
  button { font: inherit; font-size: 18px; width: 100%; min-height: 64px; border-radius: 16px; border: 0; background: #7a4a2a; color: #fff; }
  button.on { background: #a33b2b; }
  #live { min-height: 3em; margin: 14px 0; padding: 12px; background: #fffaf1; border: 1px solid #d8ccb6; border-radius: 12px; font-size: 18px; }
  #live .interim { color: #a3937e; }
  #log { font: 12px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; background: #fffaf1; border: 1px solid #d8ccb6; border-radius: 12px; padding: 10px; }
</style>
</head>
<body>
<h1>Voice test</h1>
<p>Tap the button, say one or two sentences, pause for a few seconds, keep talking, then tap again to stop. Then screenshot this page (or read me the summary line).</p>
<button id="go">Tap to start</button>
<div id="live"></div>
<div id="summary" style="font-weight:600;margin-bottom:8px"></div>
<div id="log"></div>
<script>
  const t0 = Date.now();
  const logEl = document.getElementById('log');
  const live = document.getElementById('live');
  const btn = document.getElementById('go');
  const sum = document.getElementById('summary');
  const seen = { start: false, interim: false, final: false, autoEnd: false, stopDelivered: null, error: null };
  let rec = null, listening = false, stopTappedAt = 0, finalText = '';
  function log(m) { logEl.textContent += `${((Date.now() - t0) / 1000).toFixed(1)}s  ${m}\n`; }
  function summary() {
    sum.textContent = `supported=${!!SR} start=${seen.start} interim=${seen.interim} final=${seen.final} ` +
      `endedOnItsOwn=${seen.autoEnd} textAfterStop=${seen.stopDelivered} error=${seen.error || 'none'} ` +
      `standalone=${!!navigator.standalone}`;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  log(`UA: ${navigator.userAgent}`);
  log(`SpeechRecognition: ${SR ? 'yes' : 'NO'}  standalone(home screen): ${!!navigator.standalone}`);
  summary();
  btn.addEventListener('click', () => {
    if (!SR) { log('not supported here'); return; }
    if (listening) {
      stopTappedAt = Date.now();
      log('stop tapped -> rec.stop()');
      rec.stop();
      return;
    }
    finalText = '';
    live.textContent = '';
    rec = new SR();
    rec.lang = 'en-US';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onstart = () => { seen.start = true; listening = true; btn.textContent = 'Listening… tap to stop'; btn.classList.add('on'); log('onstart'); summary(); };
    rec.onaudiostart = () => log('onaudiostart');
    rec.onspeechstart = () => log('onspeechstart');
    rec.onspeechend = () => log('onspeechend');
    rec.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) { finalText += r[0].transcript; seen.final = true; log(`FINAL: "${r[0].transcript}"`); if (stopTappedAt) seen.stopDelivered = true; }
        else { interim += r[0].transcript; seen.interim = true; }
      }
      live.innerHTML = '';
      live.append(document.createTextNode(finalText));
      const s = document.createElement('span'); s.className = 'interim'; s.textContent = interim; live.append(s);
      summary();
    };
    rec.onerror = (e) => { seen.error = e.error || 'unknown'; log(`onerror: ${e.error}`); summary(); };
    rec.onend = () => {
      listening = false;
      btn.textContent = 'Tap to start'; btn.classList.remove('on');
      if (!stopTappedAt) seen.autoEnd = true;
      if (stopTappedAt && seen.stopDelivered === null) seen.stopDelivered = false;
      log(`onend (${stopTappedAt ? 'after stop tap' : 'ON ITS OWN, no stop tap'})`);
      stopTappedAt = 0;
      summary();
    };
    try { rec.start(); log('rec.start() called'); } catch (err) { seen.error = err.name; log(`start threw: ${err.name} ${err.message}`); summary(); }
  });
</script>
</body>
</html>
